apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hackathon-app
  template:
    metadata:
      labels:
        app: hackathon-app
    spec:
      containers:
        - name: hackathon-app
          image: 399707826352.dkr.ecr.us-east-1.amazonaws.com/hackathon-ecommerce:v1
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
